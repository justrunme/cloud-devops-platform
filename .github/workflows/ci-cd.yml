name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-lint:
    name: Validate and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint
        run: |
          tflint --init
          tflint

      - name: Trivy Config Policy Scan
        working-directory: ${{ github.workspace }}
        run: |
          trivy config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            terraform

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: validate-and-lint
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply Kind Cluster
        run: terraform apply -auto-approve -target=kind_cluster.default -target=local_file.kubeconfig
        working-directory: ./terraform

      - name: Verify Kubeconfig Exists
        run: |
          test -f ./terraform/kubeconfig
          ls -lah ./terraform/kubeconfig

      - name: Verify Kubernetes Access
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get pods -A

      - name: Terraform Apply Argo CD
        run: terraform apply -auto-approve -target=helm_release.argocd
        working-directory: ./terraform
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig

      - name: Argo CD diagnostics on failure
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n argocd describe pods | tail -80 || true

      - name: Wait for Argo CD CRDs
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          for i in {1..36}; do
            if kubectl get crd applications.argoproj.io; then
              exit 0
            fi
            echo "Waiting for Application CRD... ($i/36)"
            sleep 5
          done
          echo "Argo CD Application CRD did not become available in time"
          exit 1

      - name: Terraform Apply Full Stack
        run: terraform apply -auto-approve
        working-directory: ./terraform
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true

      - name: Run Trivy Kubernetes Scan
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          trivy k8s \
            --kubeconfig "$KUBECONFIG" \
            --report summary \
            --skip-images \
            --disable-node-collector

      - name: Run kube-bench
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          kubectl apply -f security/kube-bench-config.yaml
          kubectl wait --for=condition=complete job/kube-bench --timeout=5m
          kubectl logs job/kube-bench

      - name: Install Kubescape
        run: |
          set -euo pipefail
          ver="v3.0.42"
          # sha256 from https://github.com/kubescape/kubescape/releases/download/v3.0.42/checksums.sha256
          sha="7aae36980896a7d49e72d0b803f6271a1a555f78bc7704ea94346aa84263ee55"
          curl -fsSL "https://github.com/kubescape/kubescape/releases/download/${ver}/kubescape-ubuntu-latest" -o /usr/local/bin/kubescape
          echo "${sha}  /usr/local/bin/kubescape" | sha256sum -c -
          chmod +x /usr/local/bin/kubescape
          kubescape version

      - name: Run Kubescape Scan
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          kubescape scan \
            --kubeconfig "$KUBECONFIG" \
            --format markdown \
            --output SECURITY-REPORT.md
          cat SECURITY-REPORT.md
