name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-lint:
    name: Validate and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.75.0
          cache: true

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint
        run: |
          tflint --init
          tflint

      - name: Trivy Config Policy Scan
        working-directory: ${{ github.workspace }}
        run: |
          trivy config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            terraform

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: validate-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply Kind Cluster
        run: terraform apply -auto-approve -target=kind_cluster.default -target=local_file.kubeconfig
        working-directory: ./terraform

      - name: Verify Kubeconfig Exists
        run: |
          test -f ./terraform/kubeconfig
          ls -lah ./terraform/kubeconfig

      - name: Verify Kubernetes Access
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get pods -A

      - name: Terraform Apply Argo CD
        run: terraform apply -auto-approve -target=helm_release.argocd
        working-directory: ./terraform
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig

      - name: Wait for Argo CD CRDs
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          for i in {1..36}; do
            if kubectl get crd applications.argoproj.io; then
              exit 0
            fi
            echo "Waiting for Application CRD... ($i/36)"
            sleep 5
          done
          echo "Argo CD Application CRD did not become available in time"
          exit 1

      - name: Terraform Apply Full Stack
        run: terraform apply -auto-approve
        working-directory: ./terraform
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.75.0
          cache: true

      - name: Run Trivy Kubernetes Scan
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          trivy k8s \
            --kubeconfig "$KUBECONFIG" \
            --report summary \
            --skip-images \
            --disable-node-collector

      - name: Run kube-bench
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          kubectl apply -f security/kube-bench-config.yaml
          kubectl wait --for=condition=complete job/kube-bench --timeout=5m
          kubectl logs job/kube-bench

      - name: Install Kubescape
        run: |
          curl -s https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | /bin/bash
          echo "$HOME/.kubescape/bin" >> "$GITHUB_PATH"

      - name: Run Kubescape Scan
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          kubescape scan \
            --kubeconfig "$KUBECONFIG" \
            --format markdown \
            --output SECURITY-REPORT.md
          cat SECURITY-REPORT.md
